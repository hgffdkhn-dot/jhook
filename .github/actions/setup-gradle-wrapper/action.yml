name: Setup Gradle Wrapper
description: >
  确保仓库中存在可用的 Gradle Wrapper。
  仓库未提交 gradle-wrapper.jar（二进制文件）时，自动下载 Gradle 并生成 wrapper。

inputs:
  gradle-version:
    description: 使用的 Gradle 版本
    required: false
    default: "8.7"

runs:
  using: composite
  steps:
    - name: 缓存 Gradle 发行版
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/gradle-dist-${{ inputs.gradle-version }}
        key: ${{ runner.os }}-gradle-dist-${{ inputs.gradle-version }}

    - name: 生成或校验 Gradle Wrapper
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.gradle-version }}"
        DIST_DIR="${RUNNER_TEMP}/gradle-dist-${VERSION}"

        # 发行版解压后自带 gradle-<version>/ 顶层目录，一律用 find 定位，不做目录平铺
        find_gradle() {
          find "$DIST_DIR" -maxdepth 4 -type f -path "*/bin/gradle" -perm -u+x 2>/dev/null | head -n 1
        }

        GRADLE_BIN="$(find_gradle || true)"

        if [ -z "$GRADLE_BIN" ] || [ ! -x "$GRADLE_BIN" ]; then
          echo "::notice::未找到缓存的 Gradle ${VERSION}，开始下载"
          mkdir -p "$DIST_DIR"
          curl -sSL --fail --retry 3 --retry-delay 2 \
            -o "${RUNNER_TEMP}/gradle-${VERSION}.zip" \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip"
          unzip -q -o "${RUNNER_TEMP}/gradle-${VERSION}.zip" -d "$DIST_DIR"
          rm -f "${RUNNER_TEMP}/gradle-${VERSION}.zip"
          GRADLE_BIN="$(find_gradle || true)"
        fi

        if [ -z "$GRADLE_BIN" ] || [ ! -x "$GRADLE_BIN" ]; then
          echo "::error::Gradle 可执行文件不可用，DIST_DIR=${DIST_DIR}"
          ls -la "$DIST_DIR" || true
          exit 1
        fi
        echo "::notice::使用 Gradle: ${GRADLE_BIN}"
        "$GRADLE_BIN" --version | head -n 4

        if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "::notice::已存在 gradle-wrapper.jar，直接使用仓库内的版本"
        else
          echo "::notice::仓库缺少 gradle-wrapper.jar，生成 Gradle ${VERSION} Wrapper"

          # 关键：`gradle wrapper` 必须在含 settings 文件的目录中执行，
          # 在空临时目录里跑会报 "does not contain a Gradle build"，
          # 直接在工作区根目录跑又会触发 Android 插件解析，因此用一个极简的空壳工程。
          WRAP_DIR="$(mktemp -d)"
          {
            echo 'rootProject.name = "wrapper-gen"'
          } > "$WRAP_DIR/settings.gradle"

          if ( cd "$WRAP_DIR" && "$GRADLE_BIN" wrapper \
                --gradle-version "$VERSION" --distribution-type bin --no-daemon -q ); then
            echo "::notice::gradle wrapper 任务执行成功"
          else
            echo "::warning::gradle wrapper 任务失败，改用直接下载 gradle-wrapper.jar"
            BASE="https://raw.githubusercontent.com/gradle/gradle/v${VERSION}.0/gradle/wrapper"
            curl -sSL --fail --retry 3 -o "$WRAP_DIR/gradle-wrapper.jar" \
              "${BASE}/gradle-wrapper.jar"
            curl -sSL --fail --retry 3 -o "$WRAP_DIR/gradlew" \
              "https://raw.githubusercontent.com/gradle/gradle/v${VERSION}.0/gradlew"
            curl -sSL --fail --retry 3 -o "$WRAP_DIR/gradlew.bat" \
              "https://raw.githubusercontent.com/gradle/gradle/v${VERSION}.0/gradlew.bat"
            mkdir -p "$WRAP_DIR/gradle/wrapper"
            cp "$WRAP_DIR/gradle-wrapper.jar" "$WRAP_DIR/gradle/wrapper/"
          fi

          mkdir -p gradle/wrapper
          if [ ! -f "$WRAP_DIR/gradlew" ]; then
            echo "::error::未生成 gradlew"; ls -la "$WRAP_DIR"; exit 1
          fi
          cp "$WRAP_DIR/gradlew" ./
          [ -f "$WRAP_DIR/gradlew.bat" ] && cp "$WRAP_DIR/gradlew.bat" ./ || true

          JAR="$(find "$WRAP_DIR" -type f -name 'gradle-wrapper.jar' | head -n 1 || true)"
          if [ -z "$JAR" ]; then
            echo "::error::未生成 gradle-wrapper.jar"; exit 1
          fi
          cp "$JAR" gradle/wrapper/gradle-wrapper.jar

          if [ -f "$WRAP_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            cp "$WRAP_DIR/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          fi
          rm -rf "$WRAP_DIR"
        fi

        chmod +x gradlew
        ls -l gradle/wrapper/

        # 固定 distributionUrl，避免被别的版本覆盖
        # （这里用 printf 而不是 heredoc：块里的内容会带上缩进，导致 properties 解析失败）
        printf '%s\n' \
          "distributionBase=GRADLE_USER_HOME" \
          "distributionPath=wrapper/dists" \
          "distributionUrl=https\\://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
          "networkTimeout=10000" \
          "validateDistributionUrl=true" \
          "zipStoreBase=GRADLE_USER_HOME" \
          "zipStorePath=wrapper/dists" \
          > gradle/wrapper/gradle-wrapper.properties
        cat gradle/wrapper/gradle-wrapper.properties

        ./gradlew --version | head -n 6
