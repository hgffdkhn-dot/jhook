name: Setup Gradle Wrapper
description: >
  确保仓库中存在可用的 Gradle Wrapper。
  仓库未提交 gradle-wrapper.jar（二进制文件）时，自动下载 Gradle 并生成 wrapper。

inputs:
  gradle-version:
    description: 使用的 Gradle 版本
    required: false
    default: "8.7"

runs:
  using: composite
  steps:
    - name: 缓存 Gradle 发行版
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/gradle-dist-${{ inputs.gradle-version }}
        key: ${{ runner.os }}-gradle-dist-${{ inputs.gradle-version }}

    - name: 生成或校验 Gradle Wrapper
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.gradle-version }}"
        DIST_DIR="${RUNNER_TEMP}/gradle-dist-${VERSION}"
        GRADLE_BIN=""

        # 1. 先找已缓存 / 已存在的 Gradle
        if [ -x "${DIST_DIR}/bin/gradle" ]; then
          GRADLE_BIN="${DIST_DIR}/bin/gradle"
        else
          # 兼容早期版本把发行版套了一层目录的情况
          GRADLE_BIN="$(find "$DIST_DIR" -maxdepth 3 -type f -name gradle -perm -u+x 2>/dev/null | head -n 1 || true)"
        fi

        # 2. 没有就下载并解压（注意：解压后目录是 gradle-<version>/，要平铺到 DIST_DIR）
        if [ -z "$GRADLE_BIN" ] || [ ! -x "$GRADLE_BIN" ]; then
          echo "::notice::未找到缓存的 Gradle ${VERSION}，开始下载"
          EXTRACT_DIR="${RUNNER_TEMP}/gradle-extract-${VERSION}"
          rm -rf "$EXTRACT_DIR" "$DIST_DIR"
          mkdir -p "$EXTRACT_DIR"

          curl -sSL --fail --retry 3 --retry-delay 2 \
            -o "${RUNNER_TEMP}/gradle-${VERSION}.zip" \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip"
          unzip -q "${RUNNER_TEMP}/gradle-${VERSION}.zip" -d "$EXTRACT_DIR"

          # 把 gradle-<version>/* 平铺进 DIST_DIR，而不是把目录塞进去
          SRC_DIR="$(find "$EXTRACT_DIR" -maxdepth 1 -type d -name "gradle-*" | head -n 1 || true)"
          if [ -z "$SRC_DIR" ]; then
            echo "::error::Gradle 发行版解压后未找到 gradle-* 目录"
            ls -la "$EXTRACT_DIR"
            exit 1
          fi
          mkdir -p "$DIST_DIR"
          cp -a "${SRC_DIR}/." "${DIST_DIR}/"
          rm -rf "$EXTRACT_DIR"
          GRADLE_BIN="${DIST_DIR}/bin/gradle"
        fi

        if [ ! -x "$GRADLE_BIN" ]; then
          echo "::error::Gradle 可执行文件不可用: ${GRADLE_BIN}"
          ls -la "$DIST_DIR" || true
          exit 1
        fi
        echo "::notice::使用 Gradle: ${GRADLE_BIN}"
        "$GRADLE_BIN" --version | head -n 4

        # 3. 生成 wrapper
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "::notice::仓库缺少 gradle-wrapper.jar，生成 Gradle ${VERSION} Wrapper"
          WRAP_DIR="$(mktemp -d)"
          ( cd "$WRAP_DIR" && "$GRADLE_BIN" wrapper \
              --gradle-version "$VERSION" --distribution-type bin --no-daemon -q )

          mkdir -p gradle/wrapper
          [ -f "$WRAP_DIR/gradlew" ] && cp "$WRAP_DIR/gradlew" ./ || {
            echo "::error::未生成 gradlew"; exit 1; }
          [ -f "$WRAP_DIR/gradlew.bat" ] && cp "$WRAP_DIR/gradlew.bat" ./ || true
          [ -f "$WRAP_DIR/gradle/wrapper/gradle-wrapper.jar" ] \
            && cp "$WRAP_DIR/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/ || {
            echo "::error::未生成 gradle-wrapper.jar"; exit 1; }
          cp "$WRAP_DIR/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          rm -rf "$WRAP_DIR"
        else
          echo "::notice::已存在 gradle-wrapper.jar，直接使用仓库内的版本"
        fi

        chmod +x gradlew
        ls -l gradle/wrapper/
        ./gradlew --version | head -n 6
